name: Dakota Parcels + Foreclosure Enrichment
# Manual + monthly. Dakota's attributed Tax Parcels data (owner, market value,
# homestead) refreshes slowly — monthly is plenty. Two ORDERED steps in one job:
#   1. dakota_parcels                  — streaming load of the ~150K parcel spine
#   2. dakota_foreclosure_enrichment   — address-join sheriff sales to parcels
# Order matters: the enrichment reads the parcels the loader just refreshed, so
# they run sequentially in the SAME job (guaranteed order, not a timing guess).
#
# max_records ADDED 2026-08-13 alongside the geometry change. It caps STEP 1
# ONLY and SKIPS step 2 — the enrichment joins against whatever parcels exist,
# so running it in full after a deliberately partial load would produce a
# confusing half-state. A capped run is a test of the loader, not of the join.
#
# Why a test run matters here more than most: Dakota's source is the COUNTY'S
# OWN server (gis2.co.dakota.mn.us, plain HTTP), not ArcGIS Online, and it is
# now being asked for polygon geometry — the layer does not support
# returnCentroid, so rings come back whole and _polygon_centroid() derives the
# point. If that handling is wrong, every row lands with lat=None and the run
# still reports success. That exact failure cost a full 118,418-row Washington
# load the same day. Leave blank for a full run.
on:
  workflow_dispatch:
    inputs:
      max_records:
        description: 'Cap step 1 at N parcels and SKIP step 2 (blank = full run, both steps)'
        required: false
        default: ''
  schedule:
    # 2nd of the month, 14:00 UTC = 8:00am Central (standard) / 9:00am (DST).
    # Offset from ramsey-tax (13:30) and the daily sheriff jobs (12:00-12:20 UTC)
    # so nothing overlaps.
    - cron: '0 14 2 * *'
jobs:
  scrape:
    name: Run Dakota parcels + foreclosure enrichment
    runs-on: ubuntu-latest
    # Pure httpx + DB work, no Playwright.
    #
    # RAISED 30 -> 90 on 2026-08-13. The old figure assumed "~15 pages of 10K",
    # which the loader has not done for some time — page_size is 2000, so it is
    # ~75 pages, and every page now carries polygon rings (a single residential
    # lot in this layer has ~40 vertices). Washington's comparable load takes
    # ~6.5 minutes for 118K WITHOUT rings; this is 150K WITH them, against a
    # county server rather than ArcGIS Online. A run killed at 95% wastes the
    # whole pass — this loader is not self-resuming.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Dakota parcels (spine) then foreclosure enrichment (signal)
        env:
          # --- Required: database ---
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # --- Required: app config (mirror Railway's values) ---
          ENVIRONMENT: production
          LOG_LEVEL: INFO
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          # --- Geocoding (parcel_resolver may call these) ---
          GEOCODING_ENABLED: 'true'
          GEOCODING_CACHE_DAYS: '30'
          NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          # --- Scheduler (only used by Railway, but config may require it) ---
          SCHEDULER_TIMEZONE: America/Chicago
          # --- Feature flags: enable ONLY the Dakota parcels loader ---
          SCRAPER_ANOKA_SHERIFF_ENABLED: 'false'
          SCRAPER_DAKOTA_SHERIFF_ENABLED: 'false'
          SCRAPER_DAKOTA_PARCELS_ENABLED: 'true'
          SCRAPER_HENNEPIN_SHERIFF_ENABLED: 'false'
          SCRAPER_HENNEPIN_PARCELS_ENABLED: 'false'
          SCRAPER_HENNEPIN_TAX_ROLL_ENABLED: 'false'
          SCRAPER_MCRO_PROBATE_ENABLED: 'false'
          SCRAPER_MPLS_311_ENABLED: 'false'
          SCRAPER_MPLS_VBR_ENABLED: 'false'
          SCRAPER_RAMSEY_SHERIFF_ENABLED: 'false'
          SCRAPER_RAMSEY_PARCELS_ENABLED: 'false'
          SCRAPER_RAMSEY_TAX_ROLL_ENABLED: 'false'
          SCRAPER_SAINT_PAUL_VACANT_ENABLED: 'false'
          SCRAPER_TAX_FORFEIT_ENABLED: 'false'
          SCRAPER_USPS_VACANCY_ENABLED: 'false'
          MAX_RECORDS: ${{ inputs.max_records }}
        # The runner treats an empty or unparseable second argument as NO cap,
        # so a scheduled run (which supplies no inputs) is a full run of both
        # steps. A capped run stops after step 1 — see the header.
        run: |
          echo "=== Step 1/2: load Dakota parcel spine (~150K) ==="
          python -m scripts.run_dakota_parcels github_actions "${MAX_RECORDS}"
          if [ -n "${MAX_RECORDS}" ]; then
            echo "=== Step 2/2 SKIPPED: capped run (max_records=${MAX_RECORDS}) ==="
            echo "The enrichment joins against whatever parcels exist; running it"
            echo "after a deliberately partial load would produce a half-state."
            exit 0
          fi
          echo "=== Step 2/2: enrich Dakota foreclosure rows by address join ==="
          python -m scripts.run_dakota_foreclosure_enrichment github_actions
