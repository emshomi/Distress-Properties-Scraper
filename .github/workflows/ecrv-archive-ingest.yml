name: eCRV Archive Ingest
# MANUAL ONLY. Loads ONE YEAR of the MN DOR eCRV archive (2014-10 .. 2023-12,
# 482 weekly files uploaded to 'ecrv-extracts' on 2026-09-29) into
# outcomes.ecrv_sales_history.
#
# DELIBERATELY NOT the weekly workflow:
#   - writes ecrv_sales_history, never ecrv_sales
#   - NO deal-math matview refresh and NO AVM rebuild: both are built from
#     ecrv_sales and must not see ten years of old prices
#
# Run order: 2014 with dry_run=true first (oldest format), then 2014 for real,
# then the other years. Re-running a year is safe (upsert on
# crv_number_id, parcel_id_raw).
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Archive year to load'
        required: true
        type: choice
        options: ['2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023']
      dry_run:
        description: 'Parse only, write nothing'
        required: true
        type: boolean
        default: true
jobs:
  ingest:
    name: Load eCRV archive year
    runs-on: ubuntu-latest
    # ~52 files a year at ~3,000 rows each through PostgREST upserts. A guess of
    # 20-40 minutes per year; 150 leaves headroom without letting a hang run on.
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Load the year
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIRONMENT: production
          LOG_LEVEL: INFO
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
          SCHEDULER_TIMEZONE: America/Chicago
        run: |
          python -m scripts.run_ecrv_archive_ingest "${{ inputs.year }}" ${{ inputs.dry_run && '--dry-run' || '' }}
