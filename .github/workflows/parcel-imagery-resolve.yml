name: Parcel Imagery Resolve
# Resolves Street View panoramas and aerial availability into
# core.parcel_imagery. The ONLY writer to that table.
#
# ADDED 2026-08-13 after both coverage probes reported. Street View
# near-coverage measured 92% (ramsey, hennepin), 79% (olmsted), 74% (dakota),
# 45% (crow_wing), 37% (fillmore, carlton). Aerial detail measured universal —
# low% was 0 in every county except fillmore at z19 (5%, flat farmland).
#
# COST: ~7,453 metadata calls, ALL FREE. Street View metadata does not consume
# image quota. Aerial rows are DERIVED from having a coordinate rather than
# fetched — Maps Static has no metadata endpoint, every fetch is billable, and
# resolving 7,453 parcels would burn three quarters of the monthly Essentials
# free allowance to discover something the probe already established
# statistically. Nothing here is billable.
#
# SELF-RESUMING. The working set is "distress parcels with coordinates and no
# imagery row yet", so a run cut off half way costs a re-run, not a restart.
# The distress set GROWS (8,299 -> 8,321 in thirteen hours), so re-running
# after a scrape is the normal way new parcels get imagery.
#
# SCHEDULED DAILY 2026-08-18. This was workflow_dispatch-only while the first
# run was a 7,453-parcel backfill, because a cron would have hidden how long
# that backfill took. The backlog is cleared, so the reason has expired.
#
# DAILY, NOT WEEKLY as the original note proposed. The sheriff scrapers run
# every morning at 12:00-12:20 UTC and the distress set grows with them (8,299
# -> 8,321 in thirteen hours, measured 2026-08-13). On a weekly cron a property
# scraped Wednesday shows a blank card until the following Monday -- six days
# of a live listing with no photograph. Weekly was the right call for a 25-
# minute backfill and the wrong one for a steady trickle: the run on
# 2026-08-18 resolved 75 parcels in 17 seconds, and every metadata call is
# free, so a daily pass costs nothing and closes the gap to hours.
#
# 13:45 UTC IS CHOSEN FOR ITS PLACE IN THE ORDER, not for the minute:
#   12:00-12:20  the daily sheriff scrapers -- the source of new parcels
#   12:30        redemption-promoter
#   13:30        monthly tax jobs
#   13:45        THIS -- after the day's scrapes have landed
#   14:45        postbulletin (Mon/Thu)
#   15:00        audit.run_integrity_checks()
# Running before 15:00 matters: imagery_failures_on_stubs is counted by the
# integrity check, so resolving first means the digest reports what is still
# missing AFTER the resolver has had its turn rather than before it.
#
# dry_run keeps its '0' default deliberately. A blank input on a scheduled run
# is an EMPTY env var, not an absent one (redemption-promoter.yml run #1), and
# resolve_parcel_imagery.py reads DRY_RUN == '1', so '' means live -- which is
# what a scheduled imagery pass should do. Nothing here is destructive and
# nothing here is billable.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to 1 to report the working-set size without writing'
        required: false
        default: '0'
  schedule:
    # Daily at 13:45 UTC = 8:45am Central (DST) / 7:45am (standard).
    - cron: '45 13 * * *'
jobs:
  resolve:
    name: Resolve parcel imagery
    runs-on: ubuntu-latest
    # 7,453 parcels at 0.05s pacing plus latency is roughly 15-25 minutes.
    # Generous because the script is self-resuming: a run killed at 95% costs
    # a re-run of the remainder, not of the whole set.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      # Mirrors parcel-geom-backfill.yml: outcome_capture/ scripts talk to
      # Postgres directly via psycopg2 and do not use the FastAPI service's
      # dependency set. requests is for the Google metadata endpoint. No
      # Pillow — nothing here decodes an image, because nothing here fetches
      # one.
      - name: Install Python dependencies
        run: pip install psycopg2-binary requests
      - name: Resolve parcel imagery
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python outcome_capture/resolve_parcel_imagery.py
