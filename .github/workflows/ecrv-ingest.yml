name: eCRV Ingest
# MANUAL ONLY — no schedule. The Minnesota Department of Revenue emails an
# alert when a new Weekly Sales Extract is ready; there is no fetchable URL
# (the eCRV SOAP API needs county/city credentials Govire does not have).
#
# Process:
#   1. Download the zip from the state
#   2. Upload it to the private Supabase Storage bucket 'ecrv-extracts'
#   3. Run this workflow with the object name
#   4. Verify in SQL
#
# Before this existed, the loader was an uncommitted local script — 322,728
# rows of history with no code in version control, and two extracts sitting
# unloaded. The local-scrapers README already documents what that costs.
#
# Idempotent on (crv_number_id, parcel_id_raw): re-running the same file
# updates rather than duplicates. Weekly extracts overlap by design.
#
# TWO STEPS RUN AFTER THE INGEST (added 2026-08-25):
#   - the ingest itself now reports county codes with no ecrv_county_map
#     entry, whose sales join to nothing downstream
#   - scoring.avm_training is rebuilt, because eCRV is its only input
on:
  workflow_dispatch:
    inputs:
      object_name:
        description: 'Zip filename in the ecrv-extracts bucket'
        required: true
        default: '2026-07-27-02-10-41_eCRVExtract.zip'
jobs:
  ingest:
    name: Ingest eCRV weekly extract
    runs-on: ubuntu-latest
    # RAISED 20 -> 60 on 2026-08-25. The ingest itself is seconds — ~2,700
    # certificates to ~3,000 parcel rows, the time being download plus
    # batched upserts. The AVM rebuild step below is ~15 minutes measured
    # (2.6 min fill, 12.1 min KNN, 207,118 rows), so 20 left almost no
    # margin and 60 leaves real headroom without letting a hung KNN pass
    # run indefinitely.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run eCRV ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIRONMENT: production
          LOG_LEVEL: INFO
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
          SCHEDULER_TIMEZONE: America/Chicago
        run: |
          python -m scripts.run_ecrv_ingest "${{ inputs.object_name }}"

      - name: Refresh deal-math matviews
        # === WHY HERE AND NOT ONLY ON MONDAY ===
        # scoring.comp_ratios is the rate table serving Premium deal math.
        # It refreshes on pg_cron job `refresh-deal-math`, Mondays 15:00
        # UTC — so before this step, an extract loaded on a Tuesday did not
        # reach subscribers until the following Monday. Up to five days of
        # lag on the one object a paying subscriber actually reads.
        #
        # BOTH views are eCRV-derived; read from pg_depend rather than
        # inferred from their names on 2026-08-25:
        #
        #   comp_ratios          -> outcomes.ecrv_sales,
        #                           outcomes.ecrv_county_map, core.parcels
        #   distress_multipliers -> outcomes.distressed_exit_sales
        #                           -> outcomes.ecrv_channel (eCRV),
        #                              signals.distress_with_parcel
        #
        # The Monday job STAYS. distress_multipliers also depends on
        # signals.distress_with_parcel, which the daily sheriff scrapers
        # feed, so it goes stale between ingests for a reason this step
        # does not address.
        #
        # NOT CONCURRENTLY: neither matview has a unique index, so
        # REFRESH MATERIALIZED VIEW CONCURRENTLY is unavailable. A plain
        # refresh takes an exclusive lock, which at 48 kB and 24 kB is
        # milliseconds — acceptable, and stated so nobody assumes
        # otherwise.
        #
        # Runs BEFORE the AVM rebuild: it takes seconds and serves live
        # subscribers, while the rebuild takes ~15 minutes and serves an
        # offline experiment.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          for mv in ("scoring.comp_ratios", "scoring.distress_multipliers"):
              with conn.cursor() as cur:
                  cur.execute("REFRESH MATERIALIZED VIEW %s" % mv)
                  cur.execute(
                      "SELECT count(*) FROM %s" % mv)
                  print("[refresh] %s -> %d rows"
                        % (mv, cur.fetchone()[0]), flush=True)
          conn.close()
          PY

      - name: Rebuild AVM training set
        # === WHY THIS RUNS HERE ===
        # scoring.avm_training had NO refresh path. It is a plain table, so
        # the Monday `refresh-deal-math` pg_cron job does not touch it —
        # that job refreshes scoring.comp_ratios, a different object which
        # IS current and does serve Premium deal math. avm_training was
        # built BY HAND three times (n_tup_ins 565,002 = 182,020 + 182,020
        # + 200,962) and drifted in between.
        #
        # eCRV is its ONLY input, so this is the exact moment its data
        # changes. Nothing else needs to remember.
        #
        # === WHY A FULL REBUILD AND NOT AN APPEND ===
        # knn_ratio is the median sale-to-assessment of the 10 nearest
        # PRIOR sales. Prior-only, so appending NEWER rows could not
        # invalidate existing values — which suggested an append would take
        # seconds. Measured 2026-08-25 against one real weekly extract:
        #
        #     eligible new rows      2,054
        #     strictly newer           391   (19%)
        #     dated at or before     1,663   (81%)   earliest 2024-02-01
        #
        # 81% of a weekly file is LATE-FILED. eCRV filing lags the deed by
        # up to two and a half years, and every late arrival becomes a
        # prior neighbour for rows already loaded. Append-only would leave
        # most of each affected county stale.
        #
        # === SAFE TO FAIL ===
        # The script builds scoring.avm_training_new, validates row count,
        # county count and knn coverage, and swaps only if all three pass.
        # The live table serves throughout and becomes avm_training_old at
        # the end. A failure mid-run leaves the previous build in place and
        # writes a row to scoring.avm_build_log with the reason.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENVIRONMENT: production
          LOG_LEVEL: INFO
        run: |
          python -m scripts.rebuild_avm_training \
            --source-file "${{ inputs.object_name }}"
