name: MnGeo Parcels Loader (statewide spine)

# MANUAL ONLY, deliberately — no schedule yet.
#
# This one workflow replaces what would otherwise be 51 more of them. The
# county comes from an input, and everything else about the run comes from
# core.mngeo_county_load, so adding a county is an INSERT rather than a new
# file here.
#
# WHY NO CRON YET
# ---------------
# A schedule would start re-loading counties that have not been verified
# once. The onboarding template's Phase 1 step 6 (counts, % coords, % EMV,
# % owners, address spot-check) has to pass per county first. Add a cron
# after the initial statewide load is done and verified.
#
# When it is added it should be MONTHLY AT MOST, and gated on rundate
# having advanced. The MnGeo compile is a SINGLE STATEWIDE stamp — all 87
# counties shared rundate 2026-04-28 on both 2026-04-28 and 2026-08-04, so
# it had not moved in 98 days. Paging 1.5M rows weekly for a compile that
# moves quarterly is waste. Offset from the Wabasha quarterly (4th of
# Jan/Apr/Jul/Oct 13:30 UTC), the Ramsey/Olmsted/Fillmore monthlies (1st,
# 2nd, 3rd at 13:30 UTC) and the daily sheriff jobs (12:00-12:20 UTC).
on:
  workflow_dispatch:
    inputs:
      county:
        description: >-
          County slug (e.g. stearns, st_louis, crow_wing), or --enabled to
          run every enabled county sequentially, largest first.
        required: true
        default: stearns
        type: string

jobs:
  load:
    name: Load parcel spine + owners
    runs-on: ubuntu-latest
    # St. Louis is the ceiling for a SINGLE county: 186,455 rows = 187
    # keyset pages plus a DB write per page. Wabasha's 18 pages fit in 25
    # minutes, so ~190 pages needs roughly ten times that. 330 leaves
    # headroom under the 360-minute GitHub job limit.
    #
    # DO NOT enable all 51 counties and run --enabled once: 1,562,648 rows
    # would not finish inside the job limit, and a timeout mid-batch leaves
    # counties in 'running' with no way to tell how far each got. Enable and
    # run in batches of a few counties.
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load ${{ inputs.county }}
        env:
          # --- Required: database ---
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # --- Required: app config (mirror Railway's values) ---
          ENVIRONMENT: production
          LOG_LEVEL: INFO
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          # --- Geocoding (parcel_resolver may call these) ---
          GEOCODING_ENABLED: 'true'
          GEOCODING_CACHE_DAYS: '30'
          NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          # --- Scheduler (only used by Railway, but config may require it) ---
          SCHEDULER_TIMEZONE: America/Chicago
          # --- Feature flags: enable ONLY this job ---
          # SCRAPER_MNGEO_PARCELS_ENABLED is the master toggle for all 51
          # counties. It defaults FALSE in src/config.py so a deploy can
          # never start 1.5M rows moving; it is set true HERE because this
          # workflow's whole purpose is to load them. Per-county control is
          # core.mngeo_county_load.enabled, which the runner reads.
          SCRAPER_MNGEO_PARCELS_ENABLED: 'true'
          SCRAPER_ANOKA_PARCELS_ENABLED: 'false'
          SCRAPER_ANOKA_SHERIFF_ENABLED: 'false'
          SCRAPER_DAKOTA_PARCELS_ENABLED: 'false'
          SCRAPER_DAKOTA_SHERIFF_ENABLED: 'false'
          SCRAPER_FILLMORE_LEGAL_ENABLED: 'false'
          SCRAPER_FILLMORE_PARCELS_ENABLED: 'false'
          SCRAPER_FILLMORE_PROBATE_ENABLED: 'false'
          SCRAPER_HENNEPIN_PARCELS_ENABLED: 'false'
          SCRAPER_HENNEPIN_SHERIFF_ENABLED: 'false'
          SCRAPER_HENNEPIN_TAX_ROLL_ENABLED: 'false'
          SCRAPER_MCRO_PROBATE_ENABLED: 'false'
          SCRAPER_MPLS_311_ENABLED: 'false'
          SCRAPER_MPLS_VBR_ENABLED: 'false'
          SCRAPER_OLMSTED_DELQ_LIST_ENABLED: 'false'
          SCRAPER_OLMSTED_PARCELS_ENABLED: 'false'
          SCRAPER_OLMSTED_TAX_DETAIL_ENABLED: 'false'
          SCRAPER_PARCEL_ENRICH_MNGEO_ENABLED: 'false'
          SCRAPER_POSTBULLETIN_LEGAL_ENABLED: 'false'
          SCRAPER_RAMSEY_PARCELS_ENABLED: 'false'
          SCRAPER_RAMSEY_SHERIFF_ENABLED: 'false'
          SCRAPER_RAMSEY_TAX_ROLL_ENABLED: 'false'
          SCRAPER_RAMSEY_TFL_ENABLED: 'false'
          SCRAPER_SAINT_PAUL_VACANT_ENABLED: 'false'
          SCRAPER_TAX_FORFEIT_ENABLED: 'false'
          SCRAPER_USPS_VACANCY_ENABLED: 'false'
          SCRAPER_WABASHA_PARCELS_ENABLED: 'false'
          SCRAPER_WASHINGTON_PARCELS_ENABLED: 'false'
          SCRAPER_WASHINGTON_SHERIFF_ENABLED: 'false'
        run: |
          python -m scripts.run_mngeo_parcels "${{ inputs.county }}" github_actions
