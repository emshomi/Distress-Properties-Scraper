name: Data Integrity Alert

# Nightly data-integrity checks, emailed via Resend when something needs
# attention. Companion to health-alert.yml: that one answers "did the
# scrapers run?", this one answers "is what they wrote correct?".
#
# The distinction is the whole point. On 2026-08-17 four scrapers were
# found minting ~534 synthetic parcel stubs a day, for months, while the
# health digest reported them healthy -- because it counts records_new,
# and the stubs ARE the records.
#
# ALERT-ONLY: an email goes out when a check returns 'alert' severity,
# plus a summary every Monday so a silently dead job is still visible.
# Set INTEGRITY_ALWAYS_EMAIL=1 below to force a send on every run.
#
# NOTE: audit.run_integrity_checks() is ALSO scheduled inside Postgres
# (pg_cron job 'nightly-integrity-checks', 0 15 * * *). That one writes
# findings without emailing. This workflow runs the same function 20
# minutes later, so the email reflects a fresh run even if pg_cron is
# disabled -- the two are independent on purpose.
on:
  workflow_dispatch:
  schedule:
    # 15:20 UTC = 10:20am Central (standard) / 11:20am (DST). Daily.
    # AFTER hennepin (~11:18), anoka (~12:46), dakota (~13:06) and the
    # health digest (13:00), so a morning's minting is caught same day.
    - cron: '20 15 * * *'

jobs:
  integrity-alert:
    name: Run integrity checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install httpx
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run integrity checks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          # Set to '1' to email on every run regardless of findings.
          # Worth doing for the first week so the format is familiar
          # before it goes quiet.
          INTEGRITY_ALWAYS_EMAIL: '1'
        run: |
          python -m scripts.integrity_alert
