name: Redemption Notice Promoter
# Promotes ai.extracted_redemptions into signals.distress_events.
#
# ADDED 2026-08-09. Foreclosure extractions are promoted ONE AT A TIME by a
# human through POST /extractions/approve (417 of 434 were). That gate is
# right for a few notices a day and wrong for this feed: one Crow Wing
# publication staged 144 parcels, and the 25 remaining zero-signal counties
# will stage thousands on their first sweep. Nobody clicks approve 3,000
# times, so the realistic outcomes are that promotion silently never happens
# — the hennepin_tax_roll failure, a working source disabled for months with
# nobody deciding to disable it — or that someone bulk-approves without
# looking, which is worse because it launders unreviewed rows as reviewed.
#
# So this promotes on OBJECTIVE COMPLETENESS (resolved parcel_id, county
# stated expiry, amount, bid-in date, delinquent year, confidence >= 0.80)
# and leaves everything else in the human queue. The held count and its
# reasons are logged every run.
#
# Scheduled daily at 12:30 UTC only AFTER a manual dispatch ran green on
# 2026-08-09 (run #2: floor 0.8, 0 candidates, 6 held, exit 0). Run #1
# failed on a blank confidence_floor input — an EMPTY env var is present,
# so os.environ.get returned '' rather than the default and float('')
# raised. Fixed in redemption_promoter.py; the point of dispatching first
# was to find exactly that while someone was watching.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to 1 to preview counts without writing'
        required: false
        default: '0'
      confidence_floor:
        description: 'Override the promotion confidence floor (default 0.80)'
        required: false
        default: ''
  schedule:
    # Daily at 12:30 UTC = 7:30am Central (standard) / 6:30am (DST).
    #
    # Sits between the local mnpublicnotice scrape (07:00 Central, on the
    # residential machine that feed requires because the Railway datacenter
    # IP is blocked) and redemption-builder.yml at 12:40 UTC. Notices staged
    # this morning therefore become distress events before the builder runs,
    # so nothing waits a day in staging.
    - cron: '30 12 * * *'
jobs:
  promote:
    name: Promote staged redemption notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      # Same reasoning as redemption-builder.yml: outcome_capture/ scripts
      # talk to Postgres directly via psycopg2 and do not use the FastAPI
      # service's dependency set. requirements.txt has no Postgres driver
      # because the service uses PostgREST.
      - name: Install Python dependencies
        run: pip install psycopg2-binary
      - name: Promote redemption notices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIDENCE_FLOOR: ${{ inputs.confidence_floor }}
        run: |
          python outcome_capture/redemption_promoter.py
